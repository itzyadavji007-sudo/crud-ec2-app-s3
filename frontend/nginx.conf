# Template: setup-frontend.sh replaces __BACKEND_IP__ with the backend's PRIVATE IP
server {
    listen 80;
    server_name _;

    root /var/www/crud-frontend;
    index index.html;

    # Allow file uploads up to 10 MB
    client_max_body_size 10M;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Browser -> Nginx (public) -> Backend (private)
    location /api/ {
        proxy_pass http://__BACKEND_IP__:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
